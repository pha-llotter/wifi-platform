# Who may send RADIUS requests: the vSZ (from the school's public IP, or a range in
# testing). Message-Authenticator is required, which protects against BlastRADIUS.
client vsz {
	ipaddr = $ENV{VSZ_ADDRESS}
	secret = $ENV{RADIUS_SECRET}
	require_message_authenticator = yes
	limit_proxy_state = yes
	shortname = vsz
}

# For radtest / eapol_test on the server itself.
client localhost {
	ipaddr = 127.0.0.1
	secret = $ENV{RADIUS_SECRET}
	shortname = localhost
}
